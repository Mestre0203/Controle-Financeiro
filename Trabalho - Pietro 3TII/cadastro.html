<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Lançamentos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container mt-5">
            <h2 class="text-center text-white mb-4">
                Cadastro de Lançamento
            </h2>
            <form class="card shadow p-4">
                <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    <select id="tipo" class="form-select" required>
                        <option value="">Selecione</option>
                        <option value="Entrada">Entrada</option>
                        <option value="Saída">Saída</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoria</label>
                    <select id="categoria" class="form-select">
                        <option>Patrocínio</option>
                        <option>Mensalidade</option>
                        <option>Uniformes</option>
                        <option>Equipamentos</option>
                        <option>Transporte</option>
                        <option>Arbitragem</option>
                        <option>Alimentação</option>
                        <option>Aluguel de Campo</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <input type="text" id="descricao" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Data</label>
                    <input type="date" id="data" class="form-control" required>
                </div>
                <button type="button" class="btn btn-success" onclick="salvarLancamento()">
                    Salvar Lançamento
                </button>
                <div id="mensagem" class="mt-3 fw-bold"></div>
                <hr>
                <a href="menu.html" class="btn btn-secondary">
                    Voltar ao Menu
                </a>
            </form>
        </div>
        <script src="cadastro.js"></script>
    </body>
</html>
