<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu Principal</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container mt-5">

            <h1 class="text-center mb-5">
                Controle Financeiro
            </h1>
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card shadow p-4 text-center">
                        <h3>Cadastro</h3>
                        <p>Cadastrar entradas e saídas.</p>
                        <a href="cadastro.html" class="btn btn-success">
                            Acessar
                        </a>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow p-4 text-center">
                        <h3>Listagem</h3>
                        <p>Consultar os lançamentos.</p>
                        <a href="listagem.html" class="btn btn-primary">
                            Acessar
                        </a>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow p-4 text-center">
                        <h3>Sobre</h3>
                        <p>Informações do projeto.</p>
                        <a href="sobre.html" class="btn btn-warning">
                            Acessar
                        </a>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow p-4 text-center">
                        <h3>Sair</h3>
                        <p>Encerrar a sessão.</p>
                        <button class="btn btn-danger" onclick="sair()">
                            Sair
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <script src="menu.js"></script>

</html>
