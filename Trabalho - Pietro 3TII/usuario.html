<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Controle Financeiro - Criar Usuário</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center align-items-center vh-100">
                <div class="col-md-5">
                    <div class="card shadow-lg p-4">
                        <h2 class="text-center mb-4">
                            Criar Usuário
                        </h2>
                        <div class="mb-3">
                            <label class="form-label">
                                Usuário
                            </label>
                            <input type="text" id="usuario" class="form-control" placeholder="Digite o usuário">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                Senha
                            </label>
                            <input type="password" id="senha" class="form-control" placeholder="Digite a senha">
                        </div>
                        <div id="mensagem" class="text-danger mb-3 fw-bold"></div>
                        <button id="btnCadastrar">
                            Criar usuário
                        </button>
                        <button id="btnVoltar">
                            Voltar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <script src="usuario.js"></script>
    </body>
</html>
