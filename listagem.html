<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listagem Financeira</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container my-5">
            <h2 class="text-center text-white mb-4">
                Controle Financeiro
            </h2>
            <div class="row text-center mb-4">
                <div class="col-md-4">
                    <div class="card p-3 shadow">
                        <h5>Entradas</h5>
                        <h3 id="totalEntradas">R$ 0,00</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 shadow">
                        <h5>Saídas</h5>
                        <h3 id="totalSaidas">R$ 0,00</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 shadow">
                        <h5>Saldo</h5>
                        <h3 id="saldoFinal">R$ 0,00</h3>
                    </div>
                </div>
            </div>
            <div id="lista" class="row g-3"></div>
            <div class="mt-4">
                <a href="menu.html" class="btn btn-secondary">
                    Voltar ao Menu
                </a>
            </div>
        </div>
        <script src="listagem.js"></script>
    </body>
</html>
